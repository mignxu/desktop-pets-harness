<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小呆 · 动作拼装 demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Microsoft YaHei",sans-serif;
    background:linear-gradient(#d8effb 0%,#f6f3ea 68%,#eee4d2 100%);user-select:none}
  #floor{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:1;
    background:linear-gradient(#dccfa9,#c8b287);box-shadow:0 -2px 10px rgba(90,70,40,.12)}

  #pet{position:fixed;z-index:5;cursor:grab;touch-action:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.16))}
  #pet img{width:100%;height:100%;pointer-events:none}
  #pet.grabbing{cursor:grabbing}
  #light{position:fixed;z-index:4;width:96px;height:18px;border-radius:50%;background:#3fbf6f;
    filter:blur(7px);opacity:.55;pointer-events:none;transition:background .3s}

  .glass{position:fixed;z-index:10;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:14px;
    padding:12px 14px;box-shadow:0 8px 28px rgba(60,50,30,.14);font-size:13px;color:#3a3630;line-height:1.5}

  #hud{left:16px;top:16px;width:320px}
  #hud .row1{display:flex;align-items:center;gap:8px}
  #hud .name{font-size:24px;font-weight:700;color:#2b2723}
  #stateChip{font-size:12px;color:#fff;border-radius:999px;padding:2px 10px}
  #actLabel{color:#8a7f6e}
  #actParams{color:#8a7f6e;font-size:12px}
  #actFrame{color:#4a90c4;font-size:12px;font-weight:600}
  #actGroup{color:#8a7f6e;font-size:12px}

  #panel{right:16px;top:16px;width:330px;max-height:calc(100vh - 32px);overflow:auto}
  #panel h4{margin:10px 0 4px;font-size:12px;color:#9a8f7e;font-weight:600}
  .btn{margin:2px;padding:4px 10px;border-radius:8px;border:1px solid #d8cfc0;background:#fffdf8;
    cursor:pointer;font-size:12px}
  .btn:hover{background:#f4ead6}
  .chip{margin:2px;padding:3px 8px;border-radius:8px;border:1px solid #d8cfc0;background:#fffdf8;
    cursor:pointer;font-size:12px}
  .chip.on{background:#ffd9a8;border-color:#e0a13f;font-weight:700}
  .grp{font-size:12px;color:#6a6156;margin:2px 0}
  .grp b{color:#4a443c}
  .dim{color:#a89c8a}
  #loadTip{font-size:12px;color:#4a90c4}

  #log{left:16px;bottom:16px;width:430px;max-height:190px;overflow:hidden;font-size:12px}
  #log div{color:#7a7163;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #log div:first-child{color:#3a3630;font-weight:600}

  .bubble{position:fixed;z-index:20;transform:translateX(-50%);background:rgba(255,255,255,.94);
    border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:8px 12px;font-size:13px;color:#3a3630;
    box-shadow:0 6px 18px rgba(60,50,30,.2);opacity:0;pointer-events:none;transition:opacity .2s;
    white-space:nowrap}
  .bubble.show{opacity:1;pointer-events:auto}
  .bubble.approval{border:2px solid #e05656;animation:pulse 1.2s infinite}
  .bubble button{margin-left:8px;border:none;border-radius:8px;background:#e05656;color:#fff;
    padding:3px 10px;cursor:pointer;font-size:12px}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(224,86,86,.25)}}
</style>
</head>
<body>
<div id="floor"></div>
<div id="light"></div>
<div id="pet"><img id="petImg" alt="pet" draggable="false"></div>
<div id="bubble" class="bubble"><span id="bubbleText"></span><button id="bubbleBtn">去处理 ✔</button></div>

<div id="hud" class="glass">
  <div class="row1"><span class="name">小呆</span><span id="stateChip">空闲</span></div>
  <div id="actName">-</div>
  <div id="actLabel"></div>
  <div id="actFrame"></div>
  <div id="actParams"></div>
  <div id="actGroup"></div>
  <div id="loadTip">初始化…</div>
</div>

<div id="panel" class="glass">
  <h4>壳状态模拟（优先级：审批 &gt; 干活中 &gt; 空闲）</h4>
  <button class="btn" id="btnIdle">🟢 空闲</button>
  <button class="btn" id="btnWork">🟡 开始干活(focus)</button>
  <button class="btn" id="btnApproval">🔴 审批请求</button>
  <h4>互动（DyberPet 事件语义）</h4>
  <button class="btn" id="btnPat">🖐 摸摸头</button>
  <button class="btn" id="btnFeed">🍖 喂食</button>
  <button class="btn" id="btnSleep">😴 入睡</button>
  <button class="btn" id="btnAuto">▶ 返回自动</button>
  <span class="dim">（也可直接按住宠物拖拽 / 松手下落 / 原地点击=摸摸）</span>
  <h4>动作组 · pet_conf.random_act（act_list 顺序拼接，act_prob 为相对权重）</h4>
  <div id="groups"></div>
  <h4>全部动作（点击手动播放）· act_conf.json</h4>
  <div id="chips"></div>
</div>

<div id="log" class="glass"></div>

<!-- file:// 直开时 fetch 不到 JSON，用这份由 小呆/*.json 生成的快照兜底 -->
<script src="fallback.js"></script>
<script src="xiaodai.js"></script>
</body>
</html>
