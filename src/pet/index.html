<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #stage { position: absolute; inset: 0; pointer-events: none; }
    #sprite {
      position: absolute;
      pointer-events: auto;
      image-rendering: pixelated;
      cursor: grab;
    }
    #sprite:active { cursor: grabbing; }
    #status-dot {
      position: absolute; right: 8px; bottom: 6px;
      width: 9px; height: 9px; border-radius: 50%;
      background: #3fbf7f;
      box-shadow: 0 0 6px currentColor;
      pointer-events: none;
    }
    /* 审批迷你气泡(笔记 7.3/7.5):按对话一条,可点【我去处理】 */
    .bubble {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      width: 264px;
      background: rgba(23, 26, 33, 0.96);
      border: 1px solid rgba(232, 182, 76, 0.55);
      border-radius: 10px;
      padding: 8px 10px;
      color: #e6eaf2;
      font: 12px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
      pointer-events: auto;
      box-shadow: 0 6px 24px rgba(0,0,0,.5);
    }
    .bubble + .bubble { margin-top: 6px; }
    .bubble .b-title { color: #e8b64c; font-weight: 600; margin-bottom: 2px; }
    .bubble .b-summary {
      font-family: Consolas, monospace; font-size: 11px;
      color: #b7c0d0; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; margin-bottom: 6px;
    }
    .bubble button {
      width: 100%; border: 0; border-radius: 6px;
      background: #e8b64c; color: #171a21;
      font: 600 12px "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 4px 0; cursor: pointer;
    }
    .bubble button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div id="stage">
    <img id="sprite" draggable="false" alt="" />
    <div id="bubbles"></div>
    <div id="status-dot"></div>
  </div>
  <script src="player.js"></script>
</body>
</html>
