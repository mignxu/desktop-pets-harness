<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #stage { position: absolute; inset: 0; pointer-events: none; }
    /* 精灵:底部居中,宽度由 player.js 按包尺寸×缩放设定(JS 定 px),
       保持 CSS 单次缩放 → 无锯齿;渲染模式(平滑/pixelated)按包配置 */
    #sprite {
      position: absolute;
      left: 50%; bottom: 0;
      transform: translateX(-50%);
      height: auto;
      -webkit-user-drag: none;
      pointer-events: auto;
      cursor: grab;
    }
    #ground-shadow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.30), transparent 68%);
      pointer-events: none;
    }
    #sprite:active { cursor: grabbing; }
    #status-dot {
      position: absolute; right: 8px; bottom: 6px;
      width: 9px; height: 9px; border-radius: 50%;
      background: #3fbf7f;
      box-shadow: 0 0 6px currentColor;
      pointer-events: none;
    }
    /* 审批迷你气泡(笔记 7.3/7.5):按对话一条,可点【我去处理】 */
    /* 气泡容器:由 player.js 按"角色头顶"动态定位 bottom(ToDoList frameTops 方案) */
    #bubbles {
      position: absolute; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: none; z-index: 5;
    }
    /* 气泡样式 = ToDoList 原版(白底胶囊 + 珊瑚描边 + 小尾巴) */
    .bubble {
      width: 250px;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid #e8907e;
      border-radius: 14px;
      padding: 8px 12px;
      color: #5a4a42;
      font: 600 12.5px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      position: relative;
    }
    .bubble::after {
      content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
      border: 6px solid transparent; border-top-color: #e8907e; border-bottom: none;
    }
    .bubble .b-title { color: #e8907e; font-weight: 700; margin-bottom: 2px; }
    .bubble .b-summary {
      font-size: 11.5px; font-weight: 500;
      color: #8a7568; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; margin-bottom: 6px;
    }
    .bubble button {
      border: 0; border-radius: 999px;
      background: #e8907e; color: #fff;
      font: 600 12px "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 4px 18px; cursor: pointer;
    }
    .bubble button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="ground-shadow"></div>
    <img id="sprite" draggable="false" alt="" />
    <div id="bubbles"></div>
    <div id="status-dot"></div>
  </div>
  <script src="player.js"></script>
</body>
</html>
