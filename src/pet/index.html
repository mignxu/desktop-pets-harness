<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 200px; height: 220px;
      background: transparent;
      overflow: hidden;
      user-select: none;
      cursor: default;
    }
    #stage { position: absolute; inset: 0; }
    #sprite {
      position: absolute;
      left: 36px; top: 40px;
      width: 128px; height: 128px;
      image-rendering: pixelated; /* 64px 素材 2x 放大,顺便压一压采样成本 */
    }
    #osd {
      position: absolute; left: 6px; top: 4px;
      font: 11px/1.5 Consolas, monospace;
      color: #9fe8ff;
      text-shadow: 0 1px 2px rgba(0,0,0,.8);
      pointer-events: none;
      white-space: pre;
    }
    #sprite:hover { cursor: grab; }
  </style>
</head>
<body>
  <div id="stage">
    <img id="sprite" draggable="false" alt="" />
    <div id="osd">booting…</div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
