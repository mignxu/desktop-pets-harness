<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* 视觉与 UX:复刻 AionUi(token 来自其源码 styles/themes/default-color-scheme.css,Arco 亮色) */
    :root {
      --bg-1: #f9fafb; --bg-2: #f2f3f5; --bg-3: #e5e6eb;
      --bg-hover: #f3f4f6; --bg-active: #e5e6eb;
      --bg-6: #86909c;
      --text-primary: #000000; --text-secondary: #454d5f; --text-disabled: #c9cdd4;
      --primary: #165dff; --success: #00b42a; --warning: #ff7d00; --danger: #f53f3f;
      --border-base: #e5e6eb; --border-light: #f2f3f5;
      --brand: #7583b2; --brand-hover: #596590;
      --message-user-bg: #e9efff;
      --guid-agent-bar: #eaecf7;
      --fill: #f7f8fa;
      --inverse: #ffffff;
      --run-dot: #2c7fff;   /* AionUi 生成中蓝点 */
      --mono: Consolas, "Cascadia Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--inverse); color: var(--text-primary);
      font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    #app { display: flex; flex-direction: column; height: 100vh; }

    #titlebar {
      display: flex; align-items: center; height: 36px; padding: 0 8px;
      background: var(--inverse); -webkit-app-region: drag; user-select: none; flex: none;
    }
    #titlebar .spacer { flex: 1; }
    #titlebar button {
      -webkit-app-region: no-drag;
      width: 30px; height: 26px; border: 0; border-radius: 6px;
      background: transparent; color: var(--bg-6); cursor: pointer; font-size: 13px;
    }
    #titlebar button:hover { background: var(--bg-hover); color: var(--text-primary); }

    #body { flex: 1; display: flex; min-height: 0; }

    /* ================= 侧栏(AionUi Sider 结构) ================= */
    #sidebar {
      width: 300px; flex: none; background: var(--inverse);
      display: flex; flex-direction: column; padding: 6px 8px 8px;
    }
    /* 工具栏:新对话(22px rd-6 芯片) + 批量管理图标 */
    .sider-toolbar { display: flex; align-items: center; gap: 8px; }
    .row-btn {
      display: flex; align-items: center; gap: 8px;
      height: 34px; padding: 0 8px 0 10px; border-radius: 8px;
      cursor: pointer; user-select: none; flex: none;
    }
    .row-btn:hover { background: var(--bg-hover); }
    .row-btn.active { background: var(--bg-active); }
    .row-btn .lbl {
      flex: 1; min-width: 0; font-size: 14px; font-weight: 500; line-height: 24px;
      color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip22 {
      width: 22px; height: 22px; border-radius: 6px; flex: none;
      background: var(--guid-agent-bar); border: 1px solid var(--border-base);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--text-primary); line-height: 0;
    }
    .icon-btn {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid transparent; flex: none;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); font-size: 13px; cursor: pointer;
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-entry { margin-top: 2px; }
    .sider-divider { height: 1px; background: var(--border-base); margin: 8px 10px; flex: none; }

    #sider-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    .section-label {
      display: flex; align-items: center; gap: 2px;
      height: 28px; padding: 0 12px; margin-top: 8px;
      font-size: 14px; font-weight: 500; color: var(--bg-6);
      user-select: none; cursor: default;
    }
    .ws-row .chip22 { background: transparent; border: 0; }
    .ws-row .ws-add {
      width: 22px; height: 22px; border-radius: 6px; flex: none;
      display: none; align-items: center; justify-content: center;
      color: var(--bg-6); font-size: 14px; cursor: pointer;
    }
    .ws-row:hover .ws-add { display: flex; }
    .ws-row:hover .ws-add:hover { background: var(--bg-active); color: var(--text-primary); }

    /* 对话行(嵌套在工作区下):黑圆头像 + 名称 + 运行蓝点/审批角标 */
    .conv { margin-left: 14px; }
    .conv .conv-icon {
      width: 22px; height: 22px; border-radius: 50%; background: #0d101c; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 11px; flex: none;
    }
    .run-dot {
      width: 8px; height: 8px; border-radius: 50%; flex: none;
      box-shadow: 0 0 0 2px rgba(44, 127, 255, 0.18);
    }
    .t-badge {
      font-size: 11px; background: var(--warning); color: #fff;
      border-radius: 999px; padding: 0 6px; font-weight: 600; line-height: 16px; flex: none;
    }
    .empty-section { font-size: 12px; color: var(--text-disabled); padding: 2px 12px 6px; }

    .sider-footer {
      border-top: 1px solid var(--border-base);
      padding-top: 8px; display: flex; flex-direction: column; gap: 2px; flex: none;
    }
    .side-foot {
      padding: 6px 10px 8px; font-size: 11px; color: var(--bg-6); line-height: 1.8;
    }
    .side-foot .row { display: flex; justify-content: space-between; }
    .side-foot .mono { font-family: var(--mono); }
    .ctx-bar { height: 4px; border-radius: 2px; background: var(--bg-2); overflow: hidden; margin: 5px 0 2px; }
    .ctx-bar > div { height: 100%; background: var(--success); border-radius: 2px; }

    /* ================= 主区 ================= */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--fill); }
    body.has-messages #main { justify-content: flex-start; }
    body:not(.has-messages) #main { justify-content: center; }
    body:not(.has-messages) #transcript { display: none; }
    body.has-messages #empty-cluster { display: none; }

    #transcript { flex: 1; overflow-y: auto; min-height: 0; }
    #transcript-inner { max-width: 820px; margin: 0 auto; padding: 20px 24px 8px; }

    .msg.user { display: flex; justify-content: flex-end; margin: 16px 0; }
    .msg.user .bubble {
      background: var(--message-user-bg); border-radius: 14px;
      padding: 10px 16px; max-width: 78%;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.agent { margin: 16px 0; white-space: pre-wrap; word-break: break-word; }
    .item { margin: 12px 0; }
    .card {
      border: 1px solid var(--border-base); border-radius: 12px;
      background: var(--inverse); padding: 10px 14px;
    }
    .card .head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
    .card .head .st { width: 8px; height: 8px; border-radius: 50%; background: var(--text-disabled); flex: none; }
    .card .head .st.inProgress { background: var(--success); animation: pulse 1.2s infinite; }
    .card .head .st.succeeded { background: var(--success); }
    .card .head .st.failed { background: var(--danger); }
    @keyframes pulse { 50% { opacity: .3; } }
    .card .mono { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); word-break: break-all; margin-top: 4px; }
    .card details { margin-top: 6px; }
    .card summary { cursor: pointer; color: var(--bg-6); font-size: 11.5px; user-select: none; }
    .card pre {
      margin: 6px 0 0; padding: 8px 10px; background: var(--bg-1); border-radius: 8px;
      font: 11.5px/1.55 var(--mono); color: var(--text-secondary); white-space: pre-wrap; word-break: break-word;
      max-height: 220px; overflow-y: auto;
    }
    details.reasoning summary { font-size: 12px; }
    details.reasoning pre { color: var(--bg-6); font-style: italic; }
    .approval { background: #fff7e8; border: 1px solid rgba(255, 125, 0, 0.4); }
    .approval .head b { color: #d25f00; }
    .approval .btns { display: flex; gap: 8px; margin-top: 10px; }
    .approval button {
      border: 1px solid var(--border-base); background: var(--inverse); color: var(--text-primary);
      border-radius: 999px; padding: 5px 16px; cursor: pointer; font-size: 12.5px;
    }
    .approval button.allow { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
    .approval button.deny:hover { border-color: var(--danger); color: var(--danger); }
    .approval button:disabled { opacity: .4; cursor: default; }
    .approval .resolved { font-size: 12px; color: var(--bg-6); padding: 4px 0; }
    .approval.flash { animation: flash 1s ease 3; }
    @keyframes flash { 30% { box-shadow: 0 0 0 4px rgba(255, 125, 0, .25); } }
    .divider {
      display: flex; align-items: center; gap: 10px;
      color: var(--bg-6); font-size: 11.5px; margin: 16px 0 10px;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border-light); }
    .divider .err { color: var(--danger); }
    .divider .ok { color: var(--success); }

    /* ---- Markdown(agent 回复) ---- */
    .md p { margin: 0 0 8px; }
    .md p:last-child { margin-bottom: 0; }
    .md ul, .md ol { margin: 6px 0 8px; padding-left: 22px; }
    .md li { margin: 2px 0; }
    .md code {
      background: var(--bg-2); border: 1px solid var(--border-light); border-radius: 4px;
      padding: 1px 5px; font: 12px var(--mono);
    }
    .md pre {
      background: var(--bg-1); border: 1px solid var(--border-light); border-radius: 8px;
      padding: 10px 12px; overflow-x: auto; margin: 8px 0;
    }
    .md pre code { background: transparent; border: 0; padding: 0; white-space: pre; }
    .md h1, .md h2, .md h3, .md h4 { margin: 10px 0 6px; font-size: 15px; }
    .md blockquote {
      margin: 8px 0; padding: 2px 12px;
      border-left: 3px solid var(--border-base); color: var(--text-secondary);
    }
    .md a { color: var(--primary); }
    .md table { border-collapse: collapse; margin: 8px 0; }
    .md th, .md td { border: 1px solid var(--border-base); padding: 4px 10px; font-size: 12px; }
    .md hr { border: 0; border-top: 1px solid var(--border-light); margin: 10px 0; }

    /* Diff(文件修改卡) */
    pre.diff {
      background: var(--bg-1); border: 1px solid var(--border-light); border-radius: 8px;
      font: 11.5px/1.6 var(--mono); overflow-x: auto; max-height: 260px; overflow-y: auto;
    }
    pre.diff .line { display: block; padding: 0 8px; white-space: pre; }
    pre.diff .add { color: #0a7d3f; background: rgba(0, 180, 42, 0.08); }
    pre.diff .del { color: #c5322d; background: rgba(245, 63, 63, 0.08); }
    pre.diff .hunk { color: var(--bg-6); background: var(--bg-2); }

    /* 首页构图(空态) */
    #composer-wrap { flex: none; width: min(720px, 100% - 48px); margin: 0 auto; padding-bottom: 24px; }
    body.has-messages #composer-wrap { padding-top: 8px; }
    #empty-cluster { text-align: center; margin-bottom: 18px; }
    #empty-cluster .greeting { font-size: 26px; font-weight: 700; letter-spacing: .2px; }
    .agent-bar {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--guid-agent-bar); border-radius: 999px;
      padding: 5px; margin-top: 16px; width: fit-content; margin-left: auto; margin-right: auto;
    }
    .agent-pill {
      display: flex; align-items: center; gap: 7px;
      background: var(--inverse); border-radius: 999px; padding: 6px 16px 6px 8px;
      font-size: 13.5px; font-weight: 600; cursor: default;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .agent-pill .ap-icon {
      width: 24px; height: 24px; border-radius: 50%; background: #0d101c; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .agent-bar .add-agent {
      width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent;
      color: var(--bg-6); font-size: 16px; cursor: pointer;
    }
    .agent-bar .add-agent:hover { background: var(--inverse); }
    .empty-hint { margin-top: 14px; font-size: 12.5px; color: var(--bg-6); }

    /* Composer */
    #composer {
      background: var(--inverse); border-radius: 24px;
      border: 1px solid var(--border-light);
      box-shadow: 0 8px 32px rgba(13, 16, 28, 0.08);
      padding: 16px 18px 12px;
    }
    #input {
      width: 100%; resize: none; border: 0; outline: none; background: transparent;
      font: 14.5px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--text-primary);
      padding: 2px 2px 8px; min-height: 26px; max-height: 140px;
    }
    #input::placeholder { color: var(--text-disabled); }
    #composer .actions { display: flex; align-items: center; gap: 8px; }
    #composer .actions .spacer { flex: 1; }
    .tool-chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text-secondary);
      padding: 4px 8px; border-radius: 8px; cursor: default;
      white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    }
    .tool-chip:hover { background: var(--bg-hover); }
    .chip-locked { cursor: not-allowed; }
    #send, #stop {
      width: 38px; height: 38px; border-radius: 50%; border: 0;
      cursor: pointer; font-size: 16px; line-height: 1;
      display: flex; align-items: center; justify-content: center; flex: none;
    }
    #send { background: var(--brand); color: #fff; }
    #send:hover { background: var(--brand-hover); }
    #send:disabled { background: var(--bg-3); cursor: default; }
    #stop { background: var(--brand); color: #fff; display: none; }
    .below-row { margin-top: 8px; padding: 0 6px; }
    .below-row .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12.5px; color: var(--text-secondary);
      padding: 5px 10px; border-radius: 8px; cursor: pointer;
    }
    .below-row .chip:hover { background: var(--bg-hover); }
  </style>
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div class="spacer"></div>
      <button id="btn-min" title="最小化">—</button>
      <button id="btn-close" title="收回宠物">✕</button>
    </div>
    <div id="body">
      <aside id="sidebar">
        <div class="sider-toolbar">
          <div class="row-btn" id="new-thread" style="flex:1;padding:0 8px 0 10px;">
            <span class="chip22">+</span><span class="lbl">新对话</span>
          </div>
          <div class="icon-btn" title="批量管理(逻辑后加)">☑</div>
        </div>
        <div class="row-btn nav-entry" title="逻辑后加">
          <span class="chip22" style="background:transparent;border:0;">🤖</span><span class="lbl">助手</span>
        </div>
        <div class="row-btn nav-entry" title="逻辑后加">
          <span class="chip22" style="background:transparent;border:0;">⏰</span><span class="lbl">定时任务</span>
        </div>
        <div class="sider-divider"></div>
        <div id="sider-scroll">
          <div class="section-label">工作区</div>
          <div class="row-btn ws-row" id="ws-nest" title="全局宠物 · 无头工作区">
            <span class="chip22">📁</span><span class="lbl">窝</span>
            <span class="ws-add" id="ws-add" title="在工作区内新建对话">+</span>
          </div>
          <div id="ws-threads"></div>
          <div class="section-label" id="conv-section" style="display:none;">对话</div>
          <div id="conv-list"></div>
        </div>
        <div class="sider-footer">
          <div class="side-foot" id="side-foot"></div>
          <div class="row-btn" id="theme-toggle" title="主题切换(逻辑后加)">
            <span class="chip22" style="background:transparent;border:0;">🌓</span><span class="lbl">主题</span>
          </div>
          <div class="row-btn" title="设置(逻辑后加)">
            <span class="chip22" style="background:transparent;border:0;">⚙</span><span class="lbl">设置</span>
          </div>
        </div>
      </aside>
      <main id="main">
        <div id="transcript"><div id="transcript-inner"></div></div>
        <div id="composer-wrap">
          <div id="empty-cluster">
            <div class="greeting">今天让宠物干点什么?</div>
            <div class="agent-bar">
              <span class="agent-pill" title="对话绑定 harness,不可中途切换(铁律)"><span class="ap-icon">🐾</span> Claude Code</span>
              <button class="add-agent" title="接入更多 harness(逻辑后加)" disabled>+</button>
            </div>
            <div class="empty-hint">输入任务派活;需要审批时,宠物会来喊你</div>
          </div>
          <div id="composer">
            <textarea id="input" rows="1" placeholder="让宠物干点什么…"></textarea>
            <div class="actions">
              <span class="tool-chip chip-locked" id="harness-chip" title="对话绑定 harness,不可中途切换(铁律)">🐾 Claude Code</span>
              <div class="spacer"></div>
              <span class="tool-chip" id="model-chip" title="模型(SDK 默认或 CLAUDE_MODEL)">model ⌄</span>
              <span class="tool-chip" title="权限模式:harness 原生默认档">🛡 默认审批 ⌄</span>
              <button id="stop" title="停止">⏹</button>
              <button id="send" title="发送">↑</button>
            </div>
          </div>
          <div class="below-row"><span class="chip" id="cwd-chip">📁 窝 ⌄</span></div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <script src="panel.js"></script>
</body>
</html>
